name: Ubuntu-SSH

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 3600

    steps:
      - name: Set root password and enable SSH root login
        run: |
          sudo -i bash <<'EOS'
          set -euxo pipefail
          echo "root:1213" | chpasswd
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/99-vps.conf <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          UsePAM yes
          EOF
          systemctl restart ssh
          EOS

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Join tailnet and capture IPv4
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --authkey="${TS_AUTHKEY}" \
            --hostname="gh-ssh-${GITHUB_RUN_ID}" \
            --accept-routes
          IP=""
          for i in $(seq 1 20); do
            IP=$(tailscale ip -4 2>/dev/null | head -n1 || true)
            [ -n "$IP" ] && break
            sleep 3
          done
          [ -n "$IP" ] || { echo "no tailscale ipv4"; exit 1; }
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"

      - name: Verify SSH listener
        run: |
          sudo ss -tlnp | grep ':22\b' || true
          echo "Listening on all interfaces. Tailnet IPv4: $TAILSCALE_IP"

      - name: Access info
        run: |
          echo "=== SSH ACCESS ==="
          echo "Host:     $TAILSCALE_IP"
          echo "Port:     22"
          echo "User:     root"
          echo "Password: 1213"
          echo "Command:  ssh root@$TAILSCALE_IP"
          echo "=================="

      - name: Keep alive
        run: |
          while true; do
            echo "[$(date -u)] SSH up on $TAILSCALE_IP - cancel workflow to terminate"
            sleep 300
          done
